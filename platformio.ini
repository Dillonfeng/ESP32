; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32@6.7.0
board = esp32-s3-n16r8
board_build.partitions = partitions/littlefs_big.csv
framework = arduino
build_flags = 
	-DCORE_DEBUG_LEVEL=3
	-DBOARD_HAS_PSRAM
	-DCONFIG_ESP32S3_DEFAULT_CPU_FREQ_240
	-DCONFIG_ESP32S3_SPIRAM_SUPPORT
	-DCONFIG_ESP32S3_PSRAM_OCT=1
	-DCONFIG_SPIRAM_MODE_OCT=1
	-DCONFIG_SPIRAM_SPEED_80M=1
	-DESP32
	-Iinclude
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_extra_dirs = legacy
lib_deps =
        bodmer/TFT_eSPI@^2.5.43
        bblanchon/ArduinoJson@^7.0.0
        tzapu/WiFiManager@^2.0.17
lib_ignore =
        lvgl
        ESP32-audioI2S
board_build.filesystem = littlefs
board_build.embed_files =

; ─────────────────────────────────────────────────────────────────────────
; v5 mature stack: Arduino 3.3.9 / IDF 5.5.4 / GCC14 + audioI2S v4.0.0
; Tuned LWIP (32KB TCP window + window scaling/SACK) fixes CNR/CRI HLS stutter
; per upstream issue #1211. sdkconfig.s3v5 carries the maintainer's settings.
; ─────────────────────────────────────────────────────────────────────────
[env:s3v5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
board_build.partitions = partitions/littlefs_v5.csv
framework = arduino, espidf
; 用本地完整 scons 包，彻底跳过下载和版本检查
platform_packages =
	tool-scons @ symlink://D:\ESP32-S3\tools\tool-scons
build_flags =
	-DCORE_DEBUG_LEVEL=4
	-DBOARD_HAS_PSRAM=1
	-DESP32
	-DAUDIOTASK_CORE=0
	-DARDUINO_RUNNING_CORE=1
	-DARDUINO_EVENT_RUNNING_CORE=1
	-Iinclude
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
board_build.filesystem = littlefs
lib_deps =
	bodmer/TFT_eSPI@^2.5.43
	bblanchon/ArduinoJson@^7.0.0
	tzapu/WiFiManager@^2.0.17
lib_ignore =
	lvgl
custom_component_remove =
	espressif/network_provisioning
	espressif/esp-zboss-lib
	espressif/esp-zigbee-lib
	espressif/esp_rainmaker
	espressif/rmaker_common
	espressif/esp_insights
	espressif/esp_diag_data_store
	espressif/esp_diagnostics
	espressif/cbor
	espressif/qrcode
	espressif/esp-sr
	espressif/libsodium
	espressif/esp-modbus
	espressif/esp32-camera

