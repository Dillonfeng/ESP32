<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>卡带录音机</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='9' fill='%232a2926'/%3E%3Crect x='7' y='17' width='50' height='30' rx='3' fill='%23cfc7b4'/%3E%3Ccircle cx='21' cy='32' r='7' fill='%232a2926'/%3E%3Ccircle cx='43' cy='32' r='7' fill='%232a2926'/%3E%3Ccircle cx='21' cy='32' r='2.5' fill='%23cfc7b4'/%3E%3Ccircle cx='43' cy='32' r='2.5' fill='%23cfc7b4'/%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:radial-gradient(120% 90% at 50% 30%,#2a2825 0%,#171614 55%,#0d0c0b 100%);
    color:#a8a297;
    font:14px/1.5 "Microsoft YaHei UI","PingFang SC","Segoe UI",sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100%;padding:24px 18px 18px;gap:14px;
  }
  .stage{
    position:relative;
    width:min(94vw,calc(92vh * 1.5));
    aspect-ratio:3 / 2;
    border-radius:4px;
    overflow:hidden;
    background:#c9c6bf;
    box-shadow:0 1px 0 rgba(255,255,255,.14) inset,0 22px 60px rgba(0,0,0,.6),0 0 0 1px #0b0a09;
  }
  .face{display:block;width:100%;height:100%}
  #ov{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:pointer}
  .hint{margin:0;text-align:center;font-size:12px;letter-spacing:.04em;color:#7d7568}
  .hint b{font-weight:600;color:#a99a7d}
  @media (max-width:520px){
    .stage{width:96vw}
    .hint{font-size:11px;max-width:96vw}
  }
</style>
</head>
<body>
  <div class="stage">
    <img id="face" class="face" src="assets/deck_face.png" width="960" height="640" alt="卡带录音机面板">
    <canvas id="ov" width="960" height="640" aria-label="录音机控制面板"></canvas>
  </div>
  <p class="hint">点琴键操作 · <b>R</b> 录音 · <b>P</b> 播放 · <b>空格</b> 暂停 · <b>Esc</b> 停止 · <b>← →</b> 换带</p>
  <input type="file" id="imp" accept="audio/*" multiple hidden>

<script>
(function(){
  'use strict';

  /* ---------- 画布与坐标映射（像素坐标 = 逻辑坐标 × 2） ---------- */
  var W = 480, H = 320;
  var face = document.getElementById('face');
  var ov = document.getElementById('ov');
  var ctx = ov.getContext('2d');
  ctx.setTransform(2, 0, 0, 2, 0, 0);

  var OX = 216, OY = 88, SC = 2 / 3;      // 照片坐标 -> 逻辑坐标：(p - O) * SC
  var REC_MAX = 120;                       // 与固件 REC_MAX_SEC 一致

  var KEYTOP = 252, KEYBOT = 300;
  var KB = [63, 107, 151, 195, 250, 294, 342];        // 命中边界
  var KV = [[63.3,105.3],[108.7,149.3],[152,193.3],[196,249.3],[251.3,292.7],[295.3,340]]; // 键面
  var KEYID = ['rec','rew','ff','play','stop','pause'];

  var CNT = { x:380.5, y:34, w:66, h:26.5 };          // 机械计数器窗
  var RECL = { x:60, y:227, w:46, h:12 };              // 面板上印着的 RECORD
  var REELS = [ { x:144.3, y:93.5, r:15 }, { x:246.3, y:93.6, r:15 } ];

  var C_CREAM = '#efe7d2';
  var F_PRINT = '"Bahnschrift","Segoe UI",sans-serif';
  var F_CN = '"Microsoft YaHei UI","PingFang SC",sans-serif';
  var F_MONO = 'Consolas,"Courier New",monospace';

  /* ---------- 状态 ---------- */
  var st = {
    mode: 'idle',          // idle | rec | prec | play | pplay
    ang: 0,
    level: 0,
    press: -1, pressAt: -9999,
    files: [],             // { name, url, dur, sim }
    cur: 0,
    seq: 0,
    sheet: null,           // { page }
    hits: [],
    toast: '', toastAt: -9999,
    last: performance.now()
  };

  var T = { acc: 0, t0: 0, run: false };
  function tStart(){ T.acc = 0; T.t0 = performance.now(); T.run = true; }
  function tResume(){ T.t0 = performance.now(); T.run = true; }
  function tPause(){ if (T.run){ T.acc += (performance.now() - T.t0) / 1000; T.run = false; } }

  var audio = null, stream = null, actx = null, analyser = null, anaBuf = null;
  var rec = null, chunks = [];

  /* ---------- 小工具 ---------- */
  function pad2(n){ n = Math.max(0, Math.floor(n)); return (n < 10 ? '0' : '') + n; }
  function fmt(s){ s = Math.max(0, Math.floor(s || 0)); return pad2(Math.floor(s / 60)) + ':' + pad2(s % 60); }
  function rr(x, y, w, h, r){
    var rad = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rad, y);
    ctx.arcTo(x + w, y, x + w, y + h, rad);
    ctx.arcTo(x + w, y + h, x, y + h, rad);
    ctx.arcTo(x, y + h, x, y, rad);
    ctx.arcTo(x, y, x + w, y, rad);
    ctx.closePath();
  }
  function imprint(text, x, y, font, color, align){
    ctx.font = font; ctx.textAlign = align || 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = 'rgba(255,255,255,.78)';
    ctx.fillText(text, x, y + 1);
    ctx.fillStyle = color;
    ctx.fillText(text, x, y);
  }
  function spaced(text, x, y, font, color, gap){
    ctx.font = font; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    var cx = x;
    for (var i = 0; i < text.length; i++){
      var ch = text.charAt(i);
      ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fillText(ch, cx, y + 1);
      ctx.fillStyle = color; ctx.fillText(ch, cx, y);
      cx += ctx.measureText(ch).width + gap;
    }
  }
  function toast(msg){ st.toast = msg; st.toastAt = performance.now(); }
  function curFile(){ return st.files[st.cur] || null; }
  function isPlaying(){ return st.mode === 'play' || st.mode === 'pplay'; }

  function curTime(){
    if (st.mode === 'rec' || st.mode === 'prec') return T.acc + (T.run ? (performance.now() - T.t0) / 1000 : 0);
    if (audio && (st.mode === 'play' || st.mode === 'pplay')) return audio.currentTime;
    if (st.mode === 'play' || st.mode === 'pplay') return T.acc + (T.run ? (performance.now() - T.t0) / 1000 : 0);
    return 0;
  }

  /* ---------- 录音 ---------- */
  function ensureMic(){
    if (stream) return Promise.resolve();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      return Promise.reject(new Error('no mic api'));
    }
    return navigator.mediaDevices.getUserMedia({ audio:true }).then(function(s){
      stream = s;
      try{
        actx = new (window.AudioContext || window.webkitAudioContext)();
        var src = actx.createMediaStreamSource(stream);
        analyser = actx.createAnalyser();
        analyser.fftSize = 512;
        src.connect(analyser);
        anaBuf = new Uint8Array(analyser.fftSize);
      }catch(e){ analyser = null; }
    });
  }

  function startRec(){
    if (st.mode === 'rec' || st.mode === 'prec') return;
    haltTransport();
    tStart();
    st.mode = 'rec';
    chunks = []; st.simRun = false; st.seq++;

    ensureMic().then(function(){
      try{
        rec = new MediaRecorder(stream, { mimeType:'audio/webm;codecs=opus' });
      }catch(e){
        try{ rec = new MediaRecorder(stream); }catch(e2){ rec = null; }
      }
      if (!rec){ st.simRun = true; toast('麦克风不可用 · 仅演示计时'); return; }
      rec.ondataavailable = function(ev){ if (ev.data && ev.data.size) chunks.push(ev.data); };
      rec.onstop = function(){
        var dur = T.acc;
        if (chunks.length){
          var blob = new Blob(chunks, { type:'audio/webm' });
          addTape('REC_' + ('0000' + st.seq).slice(-4) + '.WAV', URL.createObjectURL(blob), dur);
          toast('已录下 ' + fmt(dur) + ' 的磁带');
        }else{
          addTape('REC_' + ('0000' + st.seq).slice(-4) + '.WAV', null, dur, true);
          toast('未采到音频 · 仅记录计时');
        }
      };
      rec.start(250);
      toast('录音中 · 最长 ' + REC_MAX + ' 秒');
    }).catch(function(){
      st.simRun = true;
      toast('未授权麦克风 · 仅演示走带与计时');
    });
  }

  function stopRec(){
    if (st.mode !== 'rec' && st.mode !== 'prec') return;
    tPause();
    st.mode = 'idle';
    if (rec && rec.state !== 'inactive'){
      try{ rec.stop(); }catch(e){}
      rec = null;
    }else if (st.simRun){
      addTape('REC_' + ('0000' + st.seq).slice(-4) + '.WAV', null, T.acc, true);
      toast('演示录音 · 计时 ' + fmt(T.acc));
    }
    st.simRun = false;
  }

  function addTape(name, url, dur, sim){
    st.files.unshift({ name:name, url:url, dur:dur || 0, sim:!!sim });
    st.cur = 0;
  }

  /* ---------- 走带 / 放音 ---------- */
  function haltTransport(){
    if (audio){ try{ audio.pause(); }catch(e){} audio = null; }
    T.run = false;
  }

  function playAt(i){
    var f = st.files[i];
    if (!f) return;
    haltTransport();
    st.cur = i;
    st.sheet = null;
    if (!f.url){
      tStart(); st.mode = 'play';
      toast(f.sim ? '演示磁带 · 无声走带' : '正在走带');
      return;
    }
    audio = new Audio(f.url);
    audio.onended = function(){ st.mode = 'idle'; };
    audio.onerror = function(){ toast('这段磁带读不出来'); st.mode = 'idle'; };
    var p = audio.play();
    if (p && p.catch) p.catch(function(){ toast('浏览器拦下了播放'); st.mode = 'idle'; });
    st.mode = 'play';
  }

  function stepTape(d){
    if (!st.files.length){ toast('还没有磁带'); return; }
    var n = st.files.length;
    var i = (st.cur + d + n) % n;
    st.cur = i;
    if (isPlaying()) playAt(i);
    else toast('装入第 ' + (i + 1) + ' 卷');
  }

  function togglePause(){
    if (st.mode === 'rec'){ tPause(); st.mode = 'prec'; toast('录音暂停'); return; }
    if (st.mode === 'prec'){ tResume(); st.mode = 'rec'; toast('继续录音'); return; }
    if (st.mode === 'play'){
      if (audio) audio.pause(); else tPause();
      st.mode = 'pplay'; toast('暂停'); return;
    }
    if (st.mode === 'pplay'){
      if (audio) audio.play(); else tResume();
      st.mode = 'play'; toast('继续'); return;
    }
    toast('当前是待机状态');
  }

  function stopAll(){
    if (st.mode === 'rec' || st.mode === 'prec'){ stopRec(); return; }
    haltTransport();
    st.mode = 'idle';
    toast('已停止');
  }

  function onKey(i){
    st.press = i; st.pressAt = performance.now();
    var id = KEYID[i];
    if (id === 'rec'){
      if (st.mode === 'rec' || st.mode === 'prec') stopRec(); else startRec();
    }else if (id === 'rew'){ stepTape(-1);
    }else if (id === 'ff'){ stepTape(1);
    }else if (id === 'play'){
      if (st.mode === 'pplay'){ if (audio) audio.play(); else tResume(); st.mode = 'play'; }
      else if (st.mode === 'play'){ toast('正在播放'); }
      else if (st.mode === 'rec' || st.mode === 'prec'){ toast('先停止录音'); }
      else { st.sheet = { page: Math.floor(st.cur / 4) }; }
    }else if (id === 'stop'){
      stopAll();
    }else if (id === 'pause'){
      togglePause();
    }
  }

  /* ---------- 绘制：磁带卷盘 ---------- */
  function drawReels(){
    if (!face.complete || !face.naturalWidth) return;
    for (var i = 0; i < REELS.length; i++){
      var r = REELS[i];
      ctx.save();
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.clip();
      ctx.translate(r.x, r.y);
      ctx.rotate(st.ang);
      ctx.drawImage(face,(r.x - r.r) * 2,(r.y - r.r) * 2, r.r * 4, r.r * 4,-r.r,-r.r, r.r * 2, r.r * 2);
      ctx.restore();
    }
  }

  /* ---------- 绘制：机械计数器 ---------- */
  function drawCounter(sec){
    var mm = Math.min(99, Math.floor(sec / 60));
    var ss = Math.floor(sec) % 60;
    var s = pad2(mm) + pad2(ss);
    var cw = CNT.w / 4;

    ctx.save();
    rr(CNT.x + 1.2, CNT.y + 1.2, CNT.w - 2.4, CNT.h - 2.4, 2);
    ctx.clip();

    var g = ctx.createLinearGradient(0, CNT.y, 0, CNT.y + CNT.h);
    g.addColorStop(0, '#0e0e0f');
    g.addColorStop(0.5, '#232325');
    g.addColorStop(1, '#0b0b0c');
    ctx.fillStyle = g;
    ctx.fillRect(CNT.x, CNT.y, CNT.w, CNT.h);

    for (var i = 0; i < 4; i++){
      var x = CNT.x + cw * i;
      var dg = ctx.createLinearGradient(0, CNT.y, 0, CNT.y + CNT.h);
      dg.addColorStop(0, 'rgba(0,0,0,.62)');
      dg.addColorStop(0.42, 'rgba(0,0,0,.06)');
      dg.addColorStop(0.6, 'rgba(0,0,0,.06)');
      dg.addColorStop(1, 'rgba(0,0,0,.66)');
      ctx.fillStyle = dg;
      ctx.fillRect(x, CNT.y, cw, CNT.h);
      if (i){
        ctx.fillStyle = 'rgba(0,0,0,.5)';
        ctx.fillRect(x - 0.7, CNT.y, 1.4, CNT.h);
      }
    }

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '700 13px ' + F_MONO;
    ctx.shadowColor = 'rgba(255,236,196,.45)';
    ctx.shadowBlur = 6;
    for (var j = 0; j < 4; j++){
      ctx.fillStyle = '#f0eadb';
      ctx.fillText(s.charAt(j), CNT.x + cw * (j + 0.5), CNT.y + CNT.h * 0.52);
    }
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  /* ---------- 绘制：RECORD 亮起 ---------- */
  function drawRecGlow(){
    var t = performance.now();
    var k = st.mode === 'rec' ? 0.55 + 0.45 * Math.sin(t / 300) : 0.28;
    var cx = RECL.x + RECL.w / 2, cy = RECL.y + RECL.h / 2;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var g = ctx.createRadialGradient(cx, cy, 1, cx, cy, 32);
    g.addColorStop(0, 'rgba(255,66,44,' + (0.40 * k) + ')');
    g.addColorStop(0.45, 'rgba(255,52,34,' + (0.17 * k) + ')');
    g.addColorStop(1, 'rgba(255,40,28,0)');
    ctx.fillStyle = g;
    ctx.fillRect(cx - 32, cy - 32, 64, 64);
    ctx.restore();
  }

  /* ---------- 绘制：电平 ---------- */
  function drawLevel(){
    var n = 9, x0 = 370, y0 = 150, bw = 6, gap = 4;
    var lit = Math.round(Math.min(1, st.level) * n);
    for (var i = 0; i < n; i++){
      var x = x0 + i * (bw + gap);
      if (i < lit){
        var hot = i >= n - 3;
        ctx.save();
        ctx.shadowColor = hot ? 'rgba(255,90,60,.55)' : 'rgba(150,190,120,.35)';
        ctx.shadowBlur = 4;
        ctx.fillStyle = hot ? '#d0513c' : (i >= n - 6 ? '#c58a43' : '#8fa961');
        ctx.fillRect(x, y0 + (hot ? 0 : 2), bw, hot ? 12 : 10);
        ctx.restore();
      }
    }
  }

  /* ---------- 绘制：右侧版面文字 ---------- */
  function drawPanelText(){
    var f = curFile();
    var recording = (st.mode === 'rec' || st.mode === 'prec');

    if (recording){
      spaced(st.mode === 'prec' ? 'REC  PAUSED' : 'RECORDING', 370, 92, '600 9px ' + F_PRINT, '#8c2f24', 1.5);
      imprint('NEW TAPE', 370, 116, '700 19px ' + F_PRINT, '#3b3a35');
      imprint('REC_' + ('0000' + st.seq).slice(-4) + '.WAV', 370, 132, '11px ' + F_MONO, '#5d5850');
      imprintRight('MAX ' + REC_MAX + 's', 466, 132, '11px ' + F_MONO, '#5d5850');
    }else{
      spaced(f ? 'LOADED  TAPE' : 'CASSETTE  DECK', 370, 92, '600 9px ' + F_PRINT, '#6c675c', 1.4);
      imprint(f ? ('TAPE ' + pad2(st.cur + 1)) : 'NO TAPE', 370, 116, '700 19px ' + F_PRINT, '#3b3a35');
      if (f){
        imprint(f.name, 370, 132, '11px ' + F_MONO, '#5d5850');
        imprintRight(fmt(f.dur), 466, 132, '11px ' + F_MONO, '#5d5850');
      }
    }
    spaced('16 kHz  ·  MONO', 370, 306, '600 8.5px ' + F_PRINT, '#7a7364', 1.1);
  }
  function imprintRight(text, x, y, font, color){
    ctx.font = font; ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = 'rgba(255,255,255,.78)'; ctx.fillText(text, x, y + 1);
    ctx.fillStyle = color; ctx.fillText(text, x, y);
  }

  /* ---------- 绘制：按下的琴键 ---------- */
  function drawPressed(i){
    var v = KV[i];
    var x = v[0], w = v[1] - v[0], y = KEYTOP, h = KEYBOT - KEYTOP, TR = 3.4;
    ctx.save();
    rr(x, y, w, h, 2);
    ctx.clip();
    ctx.drawImage(face, x * 2, y * 2, w * 2, (h - TR) * 2, x, y + TR, w, h - TR);
    var g = ctx.createLinearGradient(0, y, 0, y + 9);
    g.addColorStop(0, 'rgba(0,0,0,.6)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x, y, w, 9);
    ctx.fillStyle = 'rgba(0,0,0,.14)';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = 'rgba(255,255,255,.1)';
    ctx.fillRect(x, y + h - 1.5, w, 1.5);
    ctx.restore();
  }

  /* ---------- 绘制：磁带索引 ---------- */
  function drawSheet(){
    var sh = st.sheet;
    var X = 30, Y = 56, WD = 420, HT = 236;
    var pages = Math.max(1, Math.ceil(st.files.length / 4));
    st.hits = [];

    ctx.save();
    ctx.fillStyle = 'rgba(10,9,8,.46)';
    ctx.fillRect(0, 0, W, H);

    ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 22; ctx.shadowOffsetY = 10;
    ctx.fillStyle = C_CREAM;
    rr(X, Y, WD, HT, 3); ctx.fill();
    ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

    ctx.strokeStyle = 'rgba(120,101,70,.6)';
    ctx.lineWidth = 1;
    rr(X + 0.5, Y + 0.5, WD - 1, HT - 1, 3); ctx.stroke();

    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.font = '700 16px ' + F_CN;
    ctx.fillStyle = '#8c2f24';
    ctx.fillText('磁带索引', X + 18, Y + 29);

    ctx.textAlign = 'right';
    ctx.font = '11px ' + F_MONO;
    ctx.fillStyle = '#8a7b5f';
    ctx.fillText((sh.page + 1) + ' / ' + pages, X + WD - 18, Y + 28);

    ctx.fillStyle = 'rgba(140,47,36,.32)';
    ctx.fillRect(X + 18, Y + 37, WD - 36, 1);

    var y0 = Y + 48, rowH = 38;
    for (var i = 0; i < 4; i++){
      var idx = sh.page * 4 + i;
      var f = st.files[idx];
      var ry = y0 + i * rowH;

      if (!f){
        if (i === 0 && !st.files.length){
          ctx.textAlign = 'center';
          ctx.font = '13px ' + F_CN;
          ctx.fillStyle = '#8b7d63';
          ctx.fillText('还没有磁带', X + WD / 2, ry + 34);
          ctx.font = '11px ' + F_CN;
          ctx.fillText('按 RECORD 录一卷，或从本机载入音频', X + WD / 2, ry + 54);
        }
        continue;
      }

      if (idx === st.cur){
        ctx.fillStyle = 'rgba(140,47,36,.10)';
        ctx.fillRect(X + 12, ry - 5, WD - 24, 32);
        ctx.fillStyle = '#8c2f24';
        ctx.fillRect(X + 12, ry - 5, 2.5, 32);
      }

      ctx.textAlign = 'left';
      ctx.font = '11px ' + F_MONO;
      ctx.fillStyle = '#9a8a6b';
      ctx.fillText(pad2(idx + 1), X + 22, ry + 16);

      ctx.font = '13px ' + F_MONO;
      ctx.fillStyle = '#2f2b23';
      ctx.fillText(f.name, X + 46, ry + 16);

      ctx.textAlign = 'right';
      ctx.font = '11px ' + F_MONO;
      ctx.fillStyle = '#6d6350';
      ctx.fillText(fmt(f.dur), X + WD - 22, ry + 16);

      st.hits.push({ x:X + 12, y:ry - 5, w:WD - 24, h:32, act:'row', i:idx });
    }

    /* 页脚 */
    var fy = Y + HT - 30;

    rr(X + 18, fy, 132, 24, 3);
    ctx.fillStyle = '#e2d6b9'; ctx.fill();
    ctx.strokeStyle = 'rgba(120,101,70,.45)'; ctx.stroke();
    ctx.textAlign = 'center';
    ctx.font = '11px ' + F_CN;
    ctx.fillStyle = '#5c503c';
    ctx.fillText('＋ 载入本机音频', X + 18 + 66, fy + 16);
    st.hits.push({ x:X + 18, y:fy, w:132, h:24, act:'load' });

    [[X + WD - 70, '‹', 'prev'], [X + WD - 40, '›', 'next']].forEach(function(b){
      rr(b[0], fy, 24, 24, 3);
      ctx.fillStyle = 'rgba(120,101,70,.12)'; ctx.fill();
      ctx.strokeStyle = 'rgba(120,101,70,.4)'; ctx.stroke();
      ctx.fillStyle = '#5c503c';
      ctx.font = '13px ' + F_PRINT;
      ctx.fillText(b[1], b[0] + 12, fy + 16.5);
      st.hits.push({ x:b[0], y:fy, w:24, h:24, act:b[2] });
    });

    ctx.textAlign = 'center';
    ctx.font = '10px ' + F_CN;
    ctx.fillStyle = '#9a8c6f';
    ctx.fillText('点卡片外返回', X + WD - 130, fy + 16);

    ctx.restore();
  }

  /* ---------- 绘制：提示条 ---------- */
  function drawToast(){
    var dt = performance.now() - st.toastAt;
    if (dt > 2100 || !st.toast) return;
    var a = dt < 1700 ? 1 : Math.max(0, 1 - (dt - 1700) / 400);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.font = '12px ' + F_CN;
    var tw = ctx.measureText(st.toast).width;
    var w = tw + 26, x = (W - w) / 2, y = H - 40;
    ctx.fillStyle = 'rgba(22,20,18,.9)';
    rr(x, y, w, 24, 3); ctx.fill();
    ctx.fillStyle = 'rgba(239,231,210,.92)';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(st.toast, W / 2, y + 12.5);
    ctx.restore();
  }

  /* ---------- 主循环 ---------- */
  var REF = 4.0, REE = 5.1;
  function render(){
    var sec = curTime();

    ctx.clearRect(0, 0, W, H);
    drawReels();

    drawCounter(sec);
    if (st.mode === 'rec' || st.mode === 'prec') drawRecGlow();
    if (st.mode === 'rec') drawLevel();

    drawPanelText();

    if (st.press >= 0 && performance.now() - st.pressAt < 240){
      drawPressed(st.press);
    }

    if (st.sheet) drawSheet();
    drawToast();
  }

  function frame(t){
    var dt = Math.min(0.06, (t - st.last) / 1000);
    st.last = t;

    if (st.mode === 'rec') st.ang += dt * REE;
    else if (st.mode === 'play') st.ang += dt * REF;

    if (st.mode === 'rec' || st.mode === 'prec'){
      if (curTime() >= REC_MAX){ stopRec(); toast('已到 ' + REC_MAX + ' 秒上限，自动停机'); }
    }

    if (analyser && anaBuf){
      analyser.getByteTimeDomainData(anaBuf);
      var peak = 0;
      for (var i = 0; i < anaBuf.length; i++){
        var v = Math.abs(anaBuf[i] - 128) / 128;
        if (v > peak) peak = v;
      }
      var target = st.mode === 'rec' ? Math.min(1, peak * 2.6) : 0;
      st.level = Math.max(target, st.level * 0.82);
    }else{
      st.level *= 0.9;
    }

    render();
    requestAnimationFrame(frame);
  }

  /* ---------- 指针 ---------- */
  function toLogical(ev){
    var r = ov.getBoundingClientRect();
    return {
      x: (ev.clientX - r.left) * (W / r.width),
      y: (ev.clientY - r.top) * (H / r.height)
    };
  }
  function hitKey(p){
    if (p.y < KEYTOP - 8 || p.y > KEYBOT + 6) return -1;
    for (var i = 0; i < 6; i++){
      if (p.x >= KB[i] && p.x < KB[i + 1]) return i;
    }
    return -1;
  }
  function hitSheet(p){
    for (var i = 0; i < st.hits.length; i++){
      var h = st.hits[i];
      if (p.x >= h.x && p.x <= h.x + h.w && p.y >= h.y && p.y <= h.y + h.h){
        return h;
      }
    }
    return null;
  }
  function sheetAction(h){
    var sh = st.sheet;
    var pages = Math.max(1, Math.ceil(st.files.length / 4));
    if (!h){ st.sheet = null; return; }
    if (h.act === 'row'){ playAt(h.i); return; }
    if (h.act === 'load'){ document.getElementById('imp').click(); return; }
    if (h.act === 'prev'){ sh.page = Math.max(0, sh.page - 1); return; }
    if (h.act === 'next'){ sh.page = Math.min(pages - 1, sh.page + 1); return; }
  }

  ov.addEventListener('pointerdown', function(ev){
    ev.preventDefault();
    var p = toLogical(ev);
    if (st.sheet){
      var X = 30, Y = 56, WD = 420, HT = 236;
      var inside = p.x >= X && p.x <= X + WD && p.y >= Y && p.y <= Y + HT;
      sheetAction(inside ? hitSheet(p) : null);
      return;
    }
    var k = hitKey(p);
    if (k >= 0) onKey(k);
  });

  document.addEventListener('keydown', function(ev){
    var k = ev.key;
    if (k === 'Escape'){ if (st.sheet) st.sheet = null; else stopAll(); ev.preventDefault(); return; }
    if (st.sheet && (k === 'ArrowLeft' || k === 'ArrowRight')){
      sheetAction({ act: k === 'ArrowLeft' ? 'prev' : 'next' });
      ev.preventDefault(); return;
    }
    if (k === 'r' || k === 'R') onKey(0);
    else if (k === 'p' || k === 'P') onKey(3);
    else if (k === ' '){ onKey(5); ev.preventDefault(); }
    else if (k === 'ArrowLeft') onKey(1);
    else if (k === 'ArrowRight') onKey(2);
    else return;
    ev.preventDefault();
  });

  /* ---------- 载入本机音频 ---------- */
  document.getElementById('imp').addEventListener('change', function(ev){
    var list = Array.prototype.slice.call(ev.target.files || []);
    if (!list.length) return;
    list.forEach(function(f){
      var url = URL.createObjectURL(f);
      var probe = new Audio();
      var dur = 0;
      probe.addEventListener('loadedmetadata', function(){
        if (isFinite(probe.duration)) dur = probe.duration;
        addTape(f.name.toUpperCase(), url, dur);
        st.sheet = { page: 0 };
        toast('已载入 ' + f.name);
      });
      probe.addEventListener('error', function(){
        addTape(f.name.toUpperCase(), url, 0);
        st.sheet = { page: 0 };
        toast('已载入 ' + f.name);
      });
      probe.src = url;
    });
    ev.target.value = '';
  });

  /* ---------- 启动 ---------- */
  tStart(); T.run = false;
  st.mode = 'idle';
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
